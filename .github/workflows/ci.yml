name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the locked project environment
        run: uv sync --frozen --all-extras
      - name: Lint and type-check
        run: make lint
      - name: Run tests
        run: make test
      - name: Run the generated-data quickstart
        run: make quickstart
      - name: Upload quickstart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickstart-evidence
          path: artifacts/quickstart/
          if-no-files-found: warn
          retention-days: 14
