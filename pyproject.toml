[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "offer-to-exit"
version = "0.1.0"
description = "A risk-aware housing acquisition and resale pricing laboratory."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "Thomas Preston Monk" },
]
keywords = [
  "housing-economics",
  "pricing",
  "decision-science",
  "uncertainty-quantification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pyarrow>=17",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.12",
  "types-PyYAML>=6.0",
]

[project.scripts]
offer-to-exit = "offer_to_exit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/offer_to_exit"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers --cov=offer_to_exit --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests over the small generated fixture",
  "slow: tests excluded from the default local feedback loop",
]

[tool.coverage.run]
branch = true
source = ["offer_to_exit"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
packages = ["offer_to_exit"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "matplotlib",
  "matplotlib.*",
  "pandas",
  "pandas.*",
  "sklearn",
  "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["offer_to_exit.models.*"]
disallow_subclassing_any = false
warn_return_any = false
